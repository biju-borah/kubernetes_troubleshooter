spring.application.name=worker-service
llm.api.base-url= https://api.groq.com/openai/v1/chat/completions
llm.api.key=${LLM_API_KEY}
llm.api.model=openai/gpt-oss-20b
spring.datasource.url=jdbc:postgresql://localhost:5432/troubleshooter
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=llm-workers
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.k8s_troubleshooter.common.entity
spring.kafka.consumer.properties.spring.json.value.default.type=com.k8s_troubleshooter.common.entity.PodSnapshot